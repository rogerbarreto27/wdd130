<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fale Conosco | As Aventura e diversão Rafting</title>

    <meta name="description"
        content="Entre em contato com a Rafting Compras para reservas, dúvidas e sugestões sobre nossas aventuras de rafting.">

    <meta name="author" content="Rogerio Barreto">

    <link rel="stylesheet" href="estilos/rafting.css">
</head>

<body>

    <header>
        <img src="imagens/rafting.png" alt="Logotipo da Rafting">

        <nav>
            <a href="index.html">Página Inicial</a>
            <a href="sobre.html">Sobre Nós</a>
            <a href="passeios.html">Passeios</a>
            <a href="contato.html">Fale Conosco</a>
        </nav>
    </header>

    <main>

        <section class="contact-info">
            <h1>Fale Conosco</h1>

            <p><strong>Endereço:</strong> Rua das Aventuras, 123 - São Paulo, SP</p>

            <p><strong>Telefone:</strong> (11) 99999-9999</p>

            <p><strong>Email:</strong> contato@raftingcompas.com</p>
        </section>

        <section class="mapa">
            <h2>Onde Estamos</h2>

            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d14630.094540327926!2d-46.633309!3d-23.55052!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ce59c8f6b5f6a7%3A0x8e6f6a6f6a6f6a6f!2sS%C3%A3o%20Paulo!5e0!3m2!1spt-BR!2sbr!4v1740000000000!5m2!1spt-BR!2sbr"
                loading="lazy">
            </iframe>
        </section>

        <section class="funcionarios">
            <h2>Conheça Nossa Equipe</h2>
            <br>

            <br>
            <figure>
                <img src="imagens/chefe.jpg" alt="Carlos Alberto">
                <figcaption>Carlos Alberto - Guia Chefe</figcaption>
            </figure>

            <figure>
                <img src="imagens/coordenador.jpg" alt="Guilherme Santos">
                <figcaption>Guilherme Santos - Coordenador de Reservas</figcaption>
            </figure>

            <figure>
                <img src="imagens/seguracadotrabalho.jpg" alt="Marcos Rodrigues">
                <figcaption>Marcos Rodrigues - Instrutor de Segurança</figcaption>
            </figure>
        </section>

        <section class="contato-formulario">

            <h2>Envie uma Mensagem</h2>

            <form>

                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required>

                <p>Motivo da Mensagem</p>

                <div>
                    <input type="radio" id="consulta" name="motivo">
                    <label for="consulta">Consulta Geral</label>
                </div>

                <div>
                    <input type="radio" id="reserva" name="motivo">
                    <label for="reserva">Pergunta sobre Reserva</label>
                </div>

                <div>
                    <input type="radio" id="sugestao" name="motivo">
                    <label for="sugestao">Sugestão de Site</label>
                </div>

                <br>

                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" name="mensagem"></textarea>

                <br>

                <div class="newsletter">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Quero receber a newsletter mensal</label>
                </div>

                <br>

                <button type="submit">Enviar Mensagem</button>

            </form>

        </section>

    </main>

    <footer>

        <p>&copy; 2026 Rafting Compas - Rogério Barreto</p>

        <nav class="redes-sociais">

            <a href="https://www.facebook.com/raftingcompas" target="_blank">
                <img class="logo" src="imagens/logo-face.png" alt="Ícone do Facebook">
            </a>

            <a href="https://www.linkedin.com/company/raftingcompas" target="_blank">
                <img class="logo" src="imagens/logo-insta.png" alt="Ícone do LinkedIn">
            </a>

            <a href="https://www.instagram.com/raftingcompas" target="_blank">
                <img class="logo" src="imagens/logo-link.png" alt="Ícone do Instagram">
            </a>

        </nav>

    </footer>

</body>

</html>
